name: Build Volla 16 Kernel (Flashable Zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: IIIMGHIII/android_kernel_volla_mt6877
          ref: volla-16.0
          path: common

      - name: Install Dependencies & System Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc curl clang lld llvm gcc-aarch64-linux-gnu python3

      - name: Sanity-check this repo is actually Bazel-buildable standalone
        run: |
          cd common
          if [ ! -f "WORKSPACE" ] && [ ! -f "MODULE.bazel" ]; then
            echo "::error::No WORKSPACE or MODULE.bazel found. This repo alone is NOT a complete"
            echo "::error::Bazel workspace -- it needs to be checked out as part of a larger multi-repo"
            echo "::error::tree (via Google's 'repo' tool + a manifest) that also provides the Kleaf"
            echo "::error::build framework (tools/bazel's real implementation), prebuilt toolchains,"
            echo "::error::and -- for full hardware support -- the device_modules repo as a sibling."
            echo "::error::Get the actual repo manifest from HelloVolla/the Volla community before this"
            echo "::error::step will do anything meaningful. See previous chat discussion for details."
            exit 1
          fi

      - name: Patch SELinux to Permissive
        run: |
          cd common
          test -f security/selinux/hooks.c || { echo "::error::hooks.c not found at expected path"; exit 1; }
          sed -i 's/unsigned int selinux_enforcing = 1;/unsigned int selinux_enforcing = 0;/' security/selinux/hooks.c
          sed -i 's/int selinux_enforcing = 1;/int selinux_enforcing = 0;/' security/selinux/hooks.c

      - name: Enable unprivileged user namespaces (sysctl-only, safe)
        run: |
          cd common
          if [ -f "kernel/sysctl.c" ]; then
            sed -i 's/int sysctl_unprivileged_userns_clone = 0;/int sysctl_unprivileged_userns_clone = 1;/' kernel/sysctl.c || true
          fi

      - name: Build Kernel (Bazel / Kleaf)
        run: |
          cd common
          ./tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=dist

      - name: Locate built Image.gz
        id: locate_image
        run: |
          IMG=$(find common/dist -iname "Image.gz" | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::No Image.gz found in dist output -- build did not produce a kernel image."
            find common/dist -maxdepth 2 || true
            exit 1
          fi
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Package as AnyKernel3 flashable zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel

          # Strip the sample config/ramdisk patches that come with the template --
          # keep only the installer scripts and META-INF, since we don't know this
          # device's exact partition/ramdisk layout. You MUST edit anykernel.sh
          # below (or replace it with a known-good one for the Quintus/algiz) before
          # this zip is safe to flash.
          rm -rf ramdisk patch tools/*.dtb 2>/dev/null || true

          cp "../${{ steps.locate_image.outputs.img }}" ./Image.gz

          cat <<'EOF' >> anykernel.sh
          # --- REVIEW THIS BEFORE FLASHING ---
          # device.name1=... , block=... , and other settings above in this file
          # are AnyKernel3 defaults and are NOT verified for the Volla Algiz/Quintus.
          # Replace anykernel.sh with a known-working one for this device if you can
          # find one, or manually fill in the correct `block=` (boot partition path)
          # and `device.name*=` (your device's build.product/model string) values
          # in the properties block near the top of this file.
          EOF

          zip -r9 ../Volla-16-Permissive-Droidspaces-Kernel-AnyKernel3.zip . -x ".git/*"

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Volla-16-Permissive-Droidspaces-Kernel-AnyKernel3
          path: Volla-16-Permissive-Droidspaces-Kernel-AnyKernel3.zip

      - name: Also upload raw Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Volla-16-Permissive-Droidspaces-Kernel-raw
          path: common/${{ steps.locate_image.outputs.img }}
