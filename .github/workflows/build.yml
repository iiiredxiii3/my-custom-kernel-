```yaml
name: Build Volla Quintus 16 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_BRANCH: volla-16.0
      KERNEL_REPO: https://github.com/HelloVolla/android_kernel_volla_mt6877.git
      DEVICE_MODULES_REPO: https://github.com/HelloVolla/android_kernel_device_modules_volla_mt6877.git
      VENDOR_MODULES_REPO: https://github.com/HelloVolla/android_kernel_modules_volla_mt6877.git

    steps:

      # ============================================================
      # 1. Checkout the GitHub Actions repository
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install repo
      # ============================================================
      - name: Install repo tool
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      # ============================================================
      # 3. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            python3 \
            python3-pip \
            python3-venv \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            cpio \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            pahole \
            libdw-dev \
            libunwind-dev \
            libcap-dev \
            libcap-ng-dev

      # ============================================================
      # 4. Initialize Google's Android 15 / Linux 6.6
      #
      # Volla Quintus volla-16.0 uses kernel-6.6.
      # This manifest provides:
      #
      #   build/kernel
      #   build/bazel_common_rules
      #   prebuilts
      #   external Bazel dependencies
      #   tools/bazel
      #
      # ============================================================
      - name: Initialize Android 15 Linux 6.6 kernel tree
        shell: bash
        run: |
          set -eux

          mkdir -p kernel-tree
          cd kernel-tree

          repo init \
            -u https://android.googlesource.com/kernel/manifest.git \
            -b common-android15-6.6-2026-07 \
            --depth=1

      # ============================================================
      # 5. Sync the Google kernel build infrastructure
      #
      # We don't want Google's "common" kernel source because
      # Volla supplies its own MT6877 kernel source.
      #
      # Sync the infrastructure first.
      # ============================================================
      - name: Sync Google kernel build infrastructure
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          repo sync \
            -c \
            -j"$(nproc)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            build/kernel \
            build/bazel_common_rules \
            prebuilts/clang/host/linux-x86 \
            prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
            prebuilts/build-tools \
            prebuilts/clang-tools \
            prebuilts/kernel-build-tools \
            external/bazelbuild-rules_cc \
            external/bazelbuild-rules_java \
            external/bazelbuild-rules_license \
            external/bazelbuild-rules_pkg \
            external/bazelbuild-rules_python \
            external/python/absl-py \
            external/stardoc \
            external/lz4 \
            external/pigz \
            external/toybox \
            external/zlib \
            external/zopfli

      # ============================================================
      # 6. Checkout the Volla Quintus kernel
      #
      # IMPORTANT:
      #
      # The device module BUILD files expect:
      #
      #     //kernel-6.6
      #
      # NOT:
      #
      #     //common
      #
      # ============================================================
      - name: Checkout Volla Quintus kernel
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" \
            kernel-6.6

      # ============================================================
      # 7. Checkout Quintus device modules
      # ============================================================
      - name: Checkout Quintus device modules
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${DEVICE_MODULES_REPO}" \
            kernel_device_modules-6.6

      # ============================================================
      # 8. Checkout Quintus MediaTek vendor modules
      # ============================================================
      - name: Checkout Quintus MediaTek vendor modules
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          mkdir -p vendor/mediatek

          git clone \
            --depth=1 \
            --branch "${KERNEL_BRANCH}" \
            "${VENDOR_MODULES_REPO}" \
            vendor/mediatek/kernel_modules

      # ============================================================
      # 9. Install Volla's MGK Bazel rules
      #
      # The Quintus BUILD.bazel explicitly loads:
      #
      #     //build/bazel_mgk_rules:mgk.bzl
      #
      # so this repository is required.
      #
      # Use the currently published Volla MGK rules branch.
      # ============================================================
      - name: Checkout Volla MGK Bazel rules
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          mkdir -p build

          git clone \
            --depth=1 \
            --branch volla-15.0-ansuz \
            https://github.com/HelloVolla/android_kernel_build_bazel_mgk_rules.git \
            build/bazel_mgk_rules

      # ============================================================
      # 10. Verify the complete source tree
      # ============================================================
      - name: Verify kernel tree
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          echo "===== ROOT ====="
          ls -la

          echo
          echo "===== KERNEL ====="
          test -f kernel-6.6/BUILD.bazel
          ls -la kernel-6.6 | head -50

          echo
          echo "===== DEVICE MODULES ====="
          test -f kernel_device_modules-6.6/BUILD.bazel
          test -f kernel_device_modules-6.6/build.sh

          echo
          echo "===== VENDOR MODULES ====="
          test -d vendor/mediatek/kernel_modules

          echo
          echo "===== KLEAF ====="
          test -f build/kernel/kleaf/bazel.sh

          echo
          echo "===== MGK RULES ====="
          test -f build/bazel_mgk_rules/mgk.bzl

          echo
          echo "===== BAZEL ====="
          test -e tools/bazel
          ls -l tools/bazel

          echo
          echo "===== WORKSPACE ====="
          test -f WORKSPACE || test -f MODULE.bazel

      # ============================================================
      # 11. Patch SELinux enforcing
      #
      # This is optional and intentionally kept from your original
      # workflow.
      # ============================================================
      - name: Patch SELinux permissive
        shell: bash
        run: |
          set -eux

          cd kernel-tree/kernel-6.6

          if grep -q \
            'unsigned int selinux_enforcing = 1;' \
            security/selinux/hooks.c
          then
            sed -i \
              's/unsigned int selinux_enforcing = 1;/unsigned int selinux_enforcing = 0;/' \
              security/selinux/hooks.c
          fi

          if grep -q \
            'int selinux_enforcing = 1;' \
            security/selinux/hooks.c
          then
            sed -i \
              's/int selinux_enforcing = 1;/int selinux_enforcing = 0;/' \
              security/selinux/hooks.c
          fi

          echo "SELinux enforcement check:"
          grep -n "selinux_enforcing" security/selinux/hooks.c | head -20 || true

      # ============================================================
      # 12. Enable unprivileged user namespaces
      # ============================================================
      - name: Enable unprivileged user namespaces
        shell: bash
        run: |
          set -eux

          cd kernel-tree/kernel-6.6

          if [ -f kernel/sysctl.c ]; then
            sed -i \
              's/int sysctl_unprivileged_userns_clone = 0;/int sysctl_unprivileged_userns_clone = 1;/' \
              kernel/sysctl.c || true
          fi

      # ============================================================
      # 13. Show Volla build configuration
      # ============================================================
      - name: Inspect Volla build configuration
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          echo "===== DEVICE BUILD CONFIG ====="
          sed -n '1,200p' \
            kernel_device_modules-6.6/build.config.mtk_kernel_device_modules

          echo
          echo "===== DEVICE BUILD SCRIPT ====="
          sed -n '1,120p' \
            kernel_device_modules-6.6/build.sh

          echo
          echo "===== KLEAF ENVIRONMENT ====="
          sed -n '1,120p' \
            kernel_device_modules-6.6/kernel/kleaf/_setup_env.sh

      # ============================================================
      # 14. Build the actual Volla Quintus kernel/modules
      #
      # Volla's own build.sh is the correct entry point.
      #
      # It constructs:
      #
      #   //kernel_device_modules-6.6:mgk_64_k66_...
      #
      # rather than the incorrect:
      #
      #   //common:kernel_aarch64_dist
      # ============================================================
      - name: Build Volla Quintus kernel
        shell: bash
        working-directory: kernel-tree
        env:
          MODE: userdebug
          DEBUG: "1"
          SANDBOX: "0"
        run: |
          set -eux

          chmod +x kernel_device_modules-6.6/build.sh

          ./kernel_device_modules-6.6/build.sh

      # ============================================================
      # 15. Locate build output
      # ============================================================
      - name: Locate build artifacts
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          echo "===== DIST ====="
          find . -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "*.dtb" \
              -o -name "*.ko" \
              -o -name "vmlinux" \
            \) \
            -print | head -200

      # ============================================================
      # 16. Collect Image.gz
      # ============================================================
      - name: Prepare kernel image
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          mkdir -p ../kernel-artifacts

          IMG=$(find . \
            -type f \
            \( -name "Image.gz" -o -name "Image" \) \
            -print | head -n1)

          if [ -z "$IMG" ]; then
            echo "::error::Kernel Image/Image.gz was not produced"
            find . -type f | grep -E 'dist|out' | head -200 || true
            exit 1
          fi

          echo "Kernel image:"
          echo "$IMG"

          cp "$IMG" ../kernel-artifacts/

      # ============================================================
      # 17. Collect DTBs
      # ============================================================
      - name: Collect DTBs
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          mkdir -p ../kernel-artifacts/dtb

          find . \
            -type f \
            -name "*.dtb" \
            -exec cp {} ../kernel-artifacts/dtb/ \;

          echo "DTBs:"
          find ../kernel-artifacts/dtb -type f || true

      # ============================================================
      # 18. Collect kernel modules
      # ============================================================
      - name: Collect kernel modules
        shell: bash
        run: |
          set -eux

          cd kernel-tree

          mkdir -p ../kernel-artifacts/modules

          find . \
            -type f \
            -name "*.ko" \
            -exec cp --parents {} ../kernel-artifacts/modules/ \;

          echo "Module count:"
          find ../kernel-artifacts/modules -name "*.ko" | wc -l

      # ============================================================
      # 19. Upload raw build artifacts
      # ============================================================
      - name: Upload raw kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Volla-Quintus-16-Kernel-Raw
          path: kernel-artifacts
          if-no-files-found: error

      # ============================================================
      # 20. Clone AnyKernel3
      # ============================================================
      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel

      # ============================================================
      # 21. Prepare AnyKernel3
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT claim this is a safe flashable
      # configuration yet.
      #
      # Quintus partition/layout information must be verified.
      # ============================================================
      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -eux

          cd anykernel

          rm -rf ramdisk patch

          find tools -type f \
            \( -name "*.dtb" -o -name "*.img" \) \
            -delete 2>/dev/null || true

          IMG=$(find ../kernel-artifacts \
            -type f \
            \( -name "Image.gz" -o -name "Image" \) \
            -print | head -n1)

          if [ -z "$IMG" ]; then
            echo "::error::No kernel image found"
            exit 1
          fi

          cp "$IMG" Image.gz

          cat > README_VOLLA_QUINTUS.txt <<'EOF'
          Volla Phone Quintus / Algiz
          Android 16 kernel build

          Kernel source:
          HelloVolla/android_kernel_volla_mt6877
          Branch:
          volla-16.0

          WARNING:
          The AnyKernel3 installer configuration has NOT been
          verified against the Volla Quintus partition layout.

          DO NOT FLASH THIS ZIP until:
          - the correct boot partition is confirmed
          - the correct slot handling is confirmed
          - device.name values are confirmed
          - kernel image format is confirmed
          - DTB/DTBO handling is confirmed

          This package is provided primarily as a build artifact.
          EOF

      # ============================================================
      # 22. Package AnyKernel3
      # ============================================================
      - name: Package AnyKernel3
        shell: bash
        run: |
          set -eux

          cd anykernel

          zip -r9 \
            ../Volla-Quintus-16-Kernel-AnyKernel3.zip \
            . \
            -x ".git/*"

      # ============================================================
      # 23. Upload AnyKernel3
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Volla-Quintus-16-Kernel-AnyKernel3
          path: Volla-Quintus-16-Kernel-AnyKernel3.zip
          if-no-files-found: error
```
