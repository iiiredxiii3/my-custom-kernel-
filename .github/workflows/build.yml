name: Build Volla Kernel with DroidSpace Support

on:
  workflow_dispatch:        # manual start from the Actions tab
  # push:                   # uncomment to build on every push
  # schedule:               # or schedule a weekly build
  #   - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # generous timeout (6 hours)

    steps:
      # ------------------------------------------------------------
      # 1. Install all required packages
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl python3 python-is-python3 repo \
            build-essential bc bison flex patch pkg-config \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler \
            kmod cpio rsync

      # ------------------------------------------------------------
      # 2. Set up Git user (needed by repo)
      # ------------------------------------------------------------
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ------------------------------------------------------------
      # 3. Initialize the kernel workspace with Google's manifest
      # ------------------------------------------------------------
      - name: Initialize repo
        run: |
          mkdir kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest.git \
                    -b common-android15-6.6

      # ------------------------------------------------------------
      # 4. Add Volla's local manifest (device‑specific repos)
      # ------------------------------------------------------------
      - name: Add Volla local manifest
        run: |
          cd kernel_workspace
          git clone https://github.com/HelloVolla/android_kernel_manifest.git \
                    -b volla-16.0-algiz .repo/local_manifests

      # ------------------------------------------------------------
      # 5. Sync all source code (this may take ~10-20 minutes)
      # ------------------------------------------------------------
      - name: Sync source
        run: |
          cd kernel_workspace
          repo sync -j$(nproc) --force-sync

      # ------------------------------------------------------------
      # 6. Patch the kernel defconfig with DroidSpace options
      # ------------------------------------------------------------
      - name: Add DroidSpace kernel configs
        run: |
          cd kernel_workspace

          # Find the defconfig for your device (assumes it contains "volla")
          DEFCONFIG_PATH=$(find . -path "*/arch/arm64/configs/*defconfig" -name "*volla*" | head -n1)

          # Fallback: use any defconfig if none found
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "No volla defconfig found, using the first defconfig found."
            DEFCONFIG_PATH=$(find . -path "*/arch/arm64/configs/*defconfig" | head -n1)
          fi

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Could not find any defconfig!"
            exit 1
          fi

          echo "Patching defconfig at: $DEFCONFIG_PATH"

          # Append all required DroidSpace options
          cat >> "$DEFCONFIG_PATH" << 'EOF'
          # DroidSpace required configs
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          EOF

          # Disable Android's paranoid network (required for internet in DroidSpace)
          if grep -q "CONFIG_ANDROID_PARANOID_NETWORK=y" "$DEFCONFIG_PATH"; then
            sed -i 's/CONFIG_ANDROID_PARANOID_NETWORK=y/# CONFIG_ANDROID_PARANOID_NETWORK is not set/' "$DEFCONFIG_PATH"
            echo "Disabled CONFIG_ANDROID_PARANOID_NETWORK."
          fi

          echo "Defconfig patched successfully."

      # ------------------------------------------------------------
      # 7. Build the kernel using Volla's build script
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          cd kernel_workspace

          # The build script is usually located at kernel_device_modules-6.6/build.sh
          if [ -f "kernel_device_modules-6.6/build.sh" ]; then
            ./kernel_device_modules-6.6/build.sh
          elif [ -f "build.sh" ]; then
            ./build.sh
          else
            echo "ERROR: No build script found!"
            exit 1
          fi

      # ------------------------------------------------------------
      # 8. Upload the resulting build artifacts
      # ------------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-out
          path: kernel_workspace/out/
          if-no-files-found: error
